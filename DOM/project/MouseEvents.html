<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Events Practice</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f2f2f2;
    }

    #box{
        width:300px;
        height:300px;
        background:skyblue;
        border:4px solid black;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:24px;
        font-weight:bold;
        cursor:pointer;
        user-select:none;
    }
</style>
</head>
<body>

<div id="box">
    Hover Me
</div>

<script>

const box = document.getElementById("box");


// box.addEventListener("click", () => {
//     console.log("Clicked");
// });

box.addEventListener("dblclick", () => {
    console.log("Double Clicked");
});

</script>

</body>
</html>
